<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2a44">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Useful Verbs Builder — 1217 Verbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2430; --paper:#f6f3ec; --panel:#ffffff;
    --brass:#8a6d2f; --brass-deep:#6b5222; --moss:#3f5d4a;
    --line:#dcd5c4; --muted:#6b6558;
    --a1:#3f5d4a; --a2:#587a52; --b1:#8a6d2f; --b2:#a8791f; --c1:#a04a2f; --c2:#7d3a54;
    --glow1:rgba(138,109,47,0.08); --glow2:rgba(63,93,74,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

  header{padding:44px 24px 28px;text-align:center;border-bottom:1px solid var(--line);background:
    radial-gradient(circle at 20% 20%, var(--glow1), transparent 55%),
    radial-gradient(circle at 80% 0%, var(--glow2), transparent 50%);position:relative;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(28px,5vw,44px);margin:0 0 6px;letter-spacing:-0.01em;}
  header p{color:var(--muted);margin:0;font-size:15px;}
  .creator-credit{font-size:12px;color:var(--muted);opacity:.8;margin-top:4px !important;font-style:italic;}
  .progress-line{max-width:520px;margin:20px auto 0;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--brass));width:0%;transition:width .4s ease;}
  .progress-label{font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.03em;}

  .controls{max-width:1000px;margin:26px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
  .search{flex:1;min-width:220px;position:relative;}
  .search input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-family:inherit;color:var(--ink);}
  .search input:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .levels{display:flex;gap:6px;flex-wrap:wrap;}
  .lvl-btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;}
  .lvl-btn:hover{border-color:var(--brass);}
  .lvl-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .lvl-btn:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .lvl-btn .count{opacity:0.65;font-weight:400;margin-left:3px;}

  main{max-width:1000px;margin:26px auto 60px;padding:0 20px;}
  .count-row{font-size:13px;color:var(--muted);margin-bottom:14px;}

  .stats-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:20px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;}
  .stat-level{font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;border-radius:5px;padding:2px 6px;display:inline-block;margin-bottom:4px;}
  .stat-count{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--ink);}
  .stat-sub{font-size:10px;color:var(--muted);margin-bottom:6px;}
  .stat-bar-track{width:100%;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .stat-bar-fill{height:100%;border-radius:4px;transition:width .4s ease;}

  .pagination{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:24px;}
  .page-btn{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .page-btn:hover:not(:disabled){border-color:var(--brass);}
  .page-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .page-label{font-size:13px;color:var(--muted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;position:relative;cursor:pointer;transition:transform .15s, box-shadow .15s, border-color .15s;min-height:118px;}
  .card.is-read{border-color:var(--moss);box-shadow:0 0 0 1px var(--moss) inset;}
  .read-check{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .15s;z-index:2;}
  .read-check:hover{border-color:var(--moss);}
  .card.is-read .read-check{background:var(--moss);border-color:var(--moss);color:#fff;}
  .stat-read{font-size:10px;color:var(--moss);margin-top:2px;font-weight:600;}
  .filter-toggle{display:flex;gap:6px;margin-left:auto;}
  .filter-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink);}
  .filter-btn.active{background:var(--moss);color:#fff;border-color:var(--moss);}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,36,48,0.07);}
  .card .tag{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:6px;color:#fff;}
  .word-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .word{font-family:'Fraunces',serif;font-size:21px;font-weight:600;}
  .pos{font-size:11px;color:var(--muted);font-style:italic;}
  .speak-btn{border:none;background:var(--paper);color:var(--brass-deep);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
  .speak-btn:hover{background:var(--brass);color:#fff;}
  .speak-btn:active{transform:scale(0.9);}
  .definition{font-size:14px;line-height:1.5;color:var(--brass-deep);margin-bottom:10px;}
  .examples{display:none;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px;}
  .examples ul{margin:0;padding-left:18px;}
  .examples li{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:4px;}
  .examples b{color:var(--ink);font-weight:600;}
  .card.flipped .examples{display:block;}
  .hint{font-size:11px;color:#a39c8a;margin-top:8px;}

  footer{text-align:center;padding:24px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);}

  @media (max-width:520px){
    .controls{flex-direction:column;align-items:stretch;}
    .levels{justify-content:center;}
  }

  /* ===== Top menu + Day wise + single level card ===== */
  .topmenu{max-width:1000px;margin:0 auto;padding:18px 20px 6px;}
  .topmenu .controls{max-width:none;margin:0;padding:0;}
  .topmenu .stats-panel{margin:0 0 16px;}
  .day-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;}
  .day-row label{font-size:12px;font-weight:600;color:var(--muted);}
  .day-row select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer;max-width:100%;}
  .day-row select:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .day-nav{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .day-nav:hover:not(:disabled){border-color:var(--brass);}
  .day-nav:disabled{opacity:.35;cursor:not-allowed;}
  .day-info{font-size:12px;color:var(--moss);font-weight:600;}
  .day-sep{flex:1;}
  .stats-panel.single{grid-template-columns:1fr;}
  .stat-card.single{padding:16px 18px;}
  .single-head{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;}
  .single-head .stat-level{margin:0;font-size:13px;padding:3px 10px;}
  .single-title{font-size:13px;color:var(--muted);}
  .single-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
  .single-nums div{background:var(--paper);border-radius:10px;padding:10px 6px;}
  .single-nums b{display:block;font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--ink);}
  .single-nums span{font-size:12px;color:var(--muted);font-weight:600;}
  .single-nums .n-read b{color:var(--moss);}
  .single-nums .n-unread b{color:var(--c1);}
  @media (max-width:520px){ .day-sep{display:none;} .single-nums b{font-size:22px;} }

  /* ===== Card spacing (after removing totals) ===== */
  .stat-card:not(.single) .stat-bar-track{margin:8px 0 6px;}

  .forms{font-size:12px;color:var(--muted);margin:-4px 0 10px;}.forms b{color:var(--ink);font-weight:600;}
  .more{font-size:13.5px;line-height:1.6;color:var(--ink);background:var(--paper);border-left:3px solid var(--brass);border-radius:6px;padding:8px 10px;margin:0 0 10px;}
  /* ===== Themes ===== */
  .theme-switch{position:absolute;top:12px;right:14px;display:flex;gap:7px;align-items:center;}
  .theme-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;transition:transform .15s, border-color .15s;}
  .theme-dot:hover{transform:scale(1.12);}
  .theme-dot.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset;}
  :root[data-theme="midnight"]{
    color-scheme:dark;
    --ink:#e9e6dd; --paper:#12161d; --panel:#1b212b; --line:#2d3644; --muted:#9aa4b2;
    --brass:#d6ac55; --brass-deep:#e6c987; --moss:#5fa882;
    --a1:#4c9a78; --a2:#6ab06a; --b1:#c49a3c; --b2:#d68c2a; --c1:#d9684a; --c2:#c4608a;
    --glow1:rgba(214,172,85,0.07); --glow2:rgba(95,168,130,0.09);
  }
  :root[data-theme="midnight"] .card:hover{box-shadow:0 8px 20px rgba(0,0,0,0.35);}
  :root[data-theme="midnight"] .hint{color:#7d8795;}
  :root[data-theme="ocean"]{
    --ink:#12263a; --paper:#eaf3f8; --panel:#ffffff; --line:#cbdce8; --muted:#587086;
    --brass:#1f6f9b; --brass-deep:#16506f; --moss:#1f7a6b;
    --a1:#1f7a6b; --a2:#2f8f5a; --b1:#1f6f9b; --b2:#3a5fb0; --c1:#7a4bb0; --c2:#b0407a;
    --glow1:rgba(31,111,155,0.10); --glow2:rgba(31,122,107,0.10);
  }
  :root[data-theme="rose"]{
    --ink:#3a1f26; --paper:#fbf0ee; --panel:#ffffff; --line:#ecd3cf; --muted:#7d5a5f;
    --brass:#b5533c; --brass-deep:#8c3a28; --moss:#a14a5e;
    --a1:#a14a5e; --a2:#c0617a; --b1:#b5533c; --b2:#d1802f; --c1:#8c3a6a; --c2:#5f3a8c;
    --glow1:rgba(181,83,60,0.09); --glow2:rgba(161,74,94,0.09);
  }
  :root[data-theme="forest"]{
    --ink:#1c2a1f; --paper:#edf3ea; --panel:#ffffff; --line:#cfdcc9; --muted:#5d6e5e;
    --brass:#6b7f2a; --brass-deep:#4d5d1d; --moss:#2f6b46;
    --a1:#2f6b46; --a2:#4a8a3c; --b1:#6b7f2a; --b2:#a08a1f; --c1:#a0562a; --c2:#7a3a50;
    --glow1:rgba(107,127,42,0.10); --glow2:rgba(47,107,70,0.10);
  }
  @media (max-width:520px){ .theme-switch{top:8px;right:10px;gap:5px;} .theme-dot{width:20px;height:20px;} }
</style>
<script>try{var t=localStorage.getItem("verbTheme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>

<header>
  <div class="theme-switch" id="themeSwitch" aria-label="Theme"></div>
  <h1>1,217 Verbs, One Journey</h1>
  <p class="creator-credit">Created by Mohammed Taufiq Bolwala</p>
  <p>A → Z · Simple English meanings · Past &amp; Past Participle · 3 example sentences per verb</p>
  <div class="progress-line"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</header>

<div class="topmenu">
  <div id="statsPanel" class="stats-panel"></div>

<div class="controls">
  <div class="search">
    <input type="text" id="searchBox" placeholder="Search a verb or meaning...">
  </div>
  <div class="levels" id="levelButtons"></div>
  <div class="filter-toggle" id="readFilterWrap">
    <button class="filter-btn active" data-f="all">All</button>
    <button class="filter-btn" data-f="unread">Unread</button>
    <button class="filter-btn" data-f="read">✓ Read</button>
  </div>
</div>

  <div class="day-row">
    <label for="daySelect">📅 Day</label>
    <button class="day-nav" id="dayPrev" title="Previous day">‹ Prev</button>
    <select id="daySelect"></select>
    <button class="day-nav" id="dayNext" title="Next day">Next ›</button>
    <span class="day-info" id="dayInfo"></span>
    <span class="day-sep"></span>
    <label for="perDaySelect">Words/day</label>
    <select id="perDaySelect">
      <option value="10">10</option><option value="15">15</option><option value="20">20</option>
      <option value="25">25</option><option value="30">30</option><option value="50">50</option>
    </select>
    <label for="pdfPageSelect">📄 PDF Page</label>
    <select id="pdfPageSelect"></select>
  </div>
</div>

<main>
  <div class="count-row" id="countRow"></div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>
</main>

<footer>Useful Verbs (PDF pages 3–43) · tap a card for examples · tap 🔊 for pronunciation · filter by letter, day or PDF page</footer>

st. A company appoints a manager. Also used when you fix a time, but that use is less common.", "Approve": "Approve means to officially say yes to a plan, leave or request, or to feel that something is good. Your boss approves your leave. Opposite: reject.", "Argue": "Argue means to speak with someone who has a different opinion, often angrily. It can also mean giving reasons to prove your point, like in a debate.", "Arise": "Arise means to start to happen or to appear, usually a problem or a question. It can also mean to get up, but that is old style. Past: arose.", "Arrest": "Arrest means when the police catch a person and take them away because of a crime. It can also mean to stop something, like arrest the spread of a disease.", "Arrive": "Arrive means to reach a place at the end of a journey. We say arrive at a small place and arrive in a big city or country. Opposite: leave.", "Ascend": "Ascend means to go up or climb, like a hill, stairs or a plane in the sky. It is a formal word. Opposite: descend.", "Ask": "Ask means to say something to get an answer, information or a thing. You ask a question, ask for help or ask someone to do something.", "Aspire": "Aspire means to have a strong wish to become or achieve something big in future. We say aspire to be something, like a doctor or an officer.", "Assemble": "Assemble means to bring people together in one place, or to join parts to make one thing. Students assemble in the hall; a worker assembles a cycle.", "Assign": "Assign means to give someone a task, duty or place. Teachers assign homework; managers assign projects. The noun is assignment.", "Assist": "Assist means to help someone do something, usually as a support person. A nurse assists a doctor. The helper is called an assistant.", "Assume": "Assume means to think something is true without checking it. It can also mean to take a post or duty, like assume charge. Do not assume, ask!", "Assure": "Assure means to tell someone strongly that something is true ngs, like plastic bags. The noun is also ban.", "Banish": "Banish means to send someone away from a place as a punishment. It is also used for removing bad thoughts: banish fear from your mind.", "Bark": "Bark is the loud sound a dog makes. It is also the hard outer cover of a tree. As a verb, it can mean to shout in an angry way.", "Bask": "Bask means to lie in warm sunlight and enjoy it. It is also used for enjoying praise, like bask in glory.", "Bat": "Bat means to hit the ball with a bat in cricket or baseball. 'Who is batting now?' The noun bat is also the thing you hit with, or a flying animal.", "Bathe": "Bathe means to wash your body, or to swim in water for pleasure. Do not confuse with bath (noun). Pronunciation: bayth.", "Bear": "Bear means to carry something, to tolerate pain or trouble, or to give birth to a child. Past: bore. Past participle: borne, or born (for birth).", "Beat": "Beat means to hit again and again, to defeat someone in a game, or when the heart makes its regular movement. Past: beat. Past participle: beaten.", "Become": "Become means to change and start to be something. 'He became a manager' or 'It became cold'. Past: became. Past participle: become.", "Befall": "Befall means that something, usually bad, happens to someone. It is a formal and old-style word. 'A great misfortune befell the family.'", "Befool": "Befool means to trick someone and make them look foolish. It is a rare word. Common words with the same meaning: fool, cheat, deceive.", "Beg": "Beg means to ask for something very humbly, like food or money. It also means to ask strongly: 'I beg you to forgive me.'", "Begin": "Begin means to start. We begin a class, a work or a journey. Past: began. Past participle: begun. Opposite: end or finish.", "Behave": "Behave means to act in a certain way. 'Behave yourself' means act politely. We also say behave well or behave badly. The noun is behaviour.", "Behold": "Behold means to look at something with attention, usually something great or wonderful. It is an old-style, formal word. Past: beheld.", "Believe": "Believe means to feel sure that something is true or that someone is honest. We believe a person, or believe in God or in an idea.", "Bellow": "Bellow means to shout or cry out in a deep, loud voice, like an angry man or a bull. It shows strong anger or pain.", "Belong": "Belong means to be the property of someone, or to be a part of a group or place. 'This book belongs to me' or 'I belong to Gujarat'.", "Bend": "Bend means to curve something that is straight, or to lean your body forward or down. Wires, pipes and roads can bend. Past: bent.", "Beseech": "Beseech means to ask someone very strongly and with deep feeling, almost like begging. It is a formal word, often used in prayers.", "Besiege": "Besiege means to surround a place with an army so people cannot go in or out. It also means a crowd gathers around someone, like fans around a star.", "Besmear": "Besmear means to cover something with a sticky or dirty substance, like oil or mud. It is also used for spoiling a person's good name.", "Bestow": "Bestow means to give something valuable, like an honour, award or blessing, to someone. It is a formal word used for respect.", "Betray": "Betray means to break someone's trust, for example by telling their secret or helping their enemy. It hurts a lot. The noun is betrayal.", "Bid": "Bid means to offer a price in an auction, or to say goodbye or wish, like bid farewell. It can also mean to order someone in a formal way.", "Bind": "Bind means to tie things together with a rope or cloth. It can also mean to force someone to follow a rule or promise. Past: bound.", "Bisect": "Bisect means to divide something into two equal parts. In maths, we bisect a line or an angle. A road or river can also bisect a city.", "Bite": "Bite means to cut or hold something with the teeth. Dogs, snakes and insects can bite. Past: bit. Past participle: bitten."};

function renderStats(){
  const panel = document.getElementById('statsPanel');
  panel.innerHTML = '';
  const target = 1000; // each level target
  const show = activeLevel==='ALL' ? levels.filter(l=>l!=='ALL') : [activeLevel];
  panel.classList.toggle('single', show.length===1);
  show.forEach(lv=>{
    const levelWords = VOCAB_DATA.filter(d=>d.l===lv);
    const count = levelWords.length;
    const pct = Math.min(100, Math.round((count/target)*100));
    const readCount = levelWords.filter(d=>readWords.has(d.w)).length;
    const unreadCount = count - readCount;
    const readPct = count ? Math.round((readCount/count)*100) : 0;
    const card = document.createElement('div');
    if(show.length===1){
      card.className = 'stat-card single';
      card.innerHTML = `
        <div class="single-head"><span class="stat-level" style="background:${levelColors[lv]}">${lv}</span><span class="single-title">Letter ${lv}</span></div>
        <div class="single-nums">
          <div><b>${count}</b><span>Total</span></div>
          <div class="n-read"><b>${readCount}</b><span>✓ Read</span></div>
          <div class="n-unread"><b>${unreadCount}</b><span>○ Unread</span></div>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${readPct}%;background:${levelColors[lv]}"></div></div>
        <div class="stat-read">${readPct}% complete</div>`;
    } else {
      card.className = 'stat-card';
      card.innerHTML = `
        <span class="stat-level" style="background:${levelColors[lv]}">${lv}</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${readPct}%;background:${levelColors[lv]}"></div></div>
        <div class="stat-read">✓ ${readCount} read · ${unreadCount} unread</div>`;
    }
    panel.appendChild(card);
  });
  buildDayOptions();
}

function buildDayOptions(){
  const sel = document.getElementById('daySelect');
  if(!sel) return;
  const items = activeLevel==='ALL' ? VOCAB_DATA : VOCAB_DATA.filter(d=>d.l===activeLevel);
  const days = Math.max(1, Math.ceil(items.length/perDay));
  const tot = new Array(days).fill(0), rd = new Array(days).fill(0);
  items.forEach((it,i)=>{ const d = Math.floor(i/perDay); tot[d]++; if(readWords.has(it.w)) rd[d]++; });
  let html = `<option value="0">All days (${days})</option>`;
  for(let d=0; d<days; d++){
    html += `<option value="${d+1}">Day ${d+1} · ${rd[d]}/${tot[d]} read${(tot[d] && rd[d]===tot[d]) ? ' ✓' : ''}</option>`;
  }
  sel.innerHTML = html;
  if(activeDay > days) activeDay = 0;
  sel.value = String(activeDay);
  document.getElementById('dayPrev').disabled = activeDay <= 1;
  document.getElementById('dayNext').disabled = activeDay >= days;
  const info = document.getElementById('dayInfo');
  info.textContent = activeDay ? `${tot[activeDay-1]} words · ${rd[activeDay-1]} read · ${tot[activeDay-1]-rd[activeDay-1]} unread` : '';
}

let voicesReady = false;

async function speak(text){
  // Android app (Capacitor) me native Text-to-Speech use karo
  if(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()){
    try {
      var TTS = (Capacitor.Plugins && Capacitor.Plugins.TextToSpeech) ||
                (typeof Capacitor.registerPlugin === 'function' ? Capacitor.registerPlugin('TextToSpeech') : null);
      if(!TTS) throw new Error('TextToSpeech plugin app me nahi mila');
      try { await TTS.stop(); } catch(e){}
      await TTS.speak({ text: text, lang: 'en-US', rate: 0.85, pitch: 1.0, volume: 1.0 });
    } catch(e){
      var msg = (e && (e.message || e.errorMessage)) || String(e);
      alert('Voice error: ' + msg + '\n\nPhone Settings > Text-to-speech output me Google Speech Services select karo aur English voice data download karo.');
    }
    return;
  }
  if(!('speechSynthesis' in window)){
    alert('Sorry, this browser does not support voice pronunciation.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.startsWith('en'));
  if(enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

let readWords = new Set();
try { readWords = new Set(JSON.parse(localStorage.getItem('verbReadWords') || '[]')); } catch(e){ readWords = new Set(); }
let readFilter = 'all';

function saveReadWords(){
  try { localStorage.setItem('verbReadWords', JSON.stringify([...readWords])); } catch(e){}
}

function toggleRead(word, cardEl){
  if(readWords.has(word)){ readWords.delete(word); cardEl.classList.remove('is-read'); }
  else { readWords.add(word); cardEl.classList.add('is-read'); }
  saveReadWords();
  renderStats();
  if(readFilter !== 'all') render();
}

document.getElementById('readFilterWrap').addEventListener('click', e=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  readFilter = btn.dataset.f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentPage = 1;
  render();
});

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let list = VOCAB_DATA.filter(item=>{
    const levelOk = activeLevel==='ALL' || item.l===activeLevel;
    const q = query;
    const searchOk = !q || item.w.toLowerCase().includes(q) || item.d.toLowerCase().includes(q);
    const readOk = readFilter==='all' || (readFilter==='read' && readWords.has(item.w)) || (readFilter==='unread' && !readWords.has(item.w));
    const dayOk = activeDay===0 || dayOf(item)===activeDay;
    const pdfOk = activePdf==="" || item.pg===activePdf;
    return levelOk && searchOk && readOk && dayOk && pdfOk;
  });

  const pageSize = activeDay ? Math.max(list.length,1) : PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  if(currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const pageItems = list.slice(startIdx, startIdx + pageSize);

  document.getElementById('countRow').textContent =
    list.length === 0 ? 'No words found' :
    `Showing ${startIdx + 1}-${Math.min(startIdx + pageSize, list.length)} of ${list.length} word${list.length!==1?'s':''}`;

  pageItems.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'card' + (readWords.has(item.w) ? ' is-read' : '');
    const exList = item.e.map(ex => `<li>${ex}</li>`).join('');
    card.innerHTML = `
      <span class="tag" style="background:${levelColors[item.l]}">${item.l}</span>
      <button class="read-check" title="Mark as read">✓</button>
      <div class="word-row">
        <button class="speak-btn" aria-label="Hear pronunciation" title="Hear pronunciation">🔊</button>
        <span class="word">${item.w}</span><span class="pos">${item.p||''}</span>
      </div>
      <div class="definition">${item.d}</div>
      ${DETAIL[item.w] ? `<div class="more">${DETAIL[item.w]}</div>` : ''}
      <div class="forms">Past: <b>${item.f}</b> · Past Participle: <b>${item.g}</b></div>
      <div class="examples"><ul>${exList}</ul></div>
      <div class="hint">tap for examples ↓</div>
    `;
    card.onclick = () => card.classList.toggle('flipped');
    const speakBtn = card.querySelector('.speak-btn');
    speakBtn.onclick = (e) => { e.stopPropagation(); speak(item.w); };
    const readBtn = card.querySelector('.read-check');
    readBtn.onclick = (e) => { e.stopPropagation(); toggleRead(item.w, card); };
    grid.appendChild(card);
  });

  renderPagination(totalPages);
  renderStats();
}

function renderPagination(totalPages){
  const wrap = document.getElementById('pagination');
  wrap.innerHTML = '';
  if(totalPages <= 1) return;
  const prev = document.createElement('button');
  prev.className = 'page-btn';
  prev.textContent = '← Prev';
  prev.disabled = currentPage === 1;
  prev.onclick = () => { currentPage--; render(); window.scrollTo({top:0, behavior:'smooth'}); };

  const label = document.createElement('span');
  label.className = 'page-label';
  label.textContent = `Page ${currentPage} of ${totalPages}`;

  const next = document.createElement('button');
  next.className = 'page-btn';
  next.textContent = 'Next →';
  next.disabled = currentPage === totalPages;
  next.onclick = () => { currentPage++; render(); window.scrollTo({top:0, behavior:'smooth'}); };

  wrap.appendChild(prev);
  wrap.appendChild(label);
  wrap.appendChild(next);
}

<script>
(function(){
  var THEMES = [
    {id:'classic',  name:'Classic',  paper:'#f6f3ec', accent:'#8a6d2f'},
    {id:'midnight', name:'Midnight (Dark)', paper:'#12161d', accent:'#d6ac55'},
    {id:'ocean',    name:'Ocean',    paper:'#eaf3f8', accent:'#1f6f9b'},
    {id:'rose',     name:'Rose',     paper:'#fbf0ee', accent:'#b5533c'},
    {id:'forest',   name:'Forest',   paper:'#edf3ea', accent:'#2f6b46'}
  ];
  var cur = 'classic';
  try { cur = localStorage.getItem('verbTheme') || 'classic'; } catch(e){}
  if(!THEMES.some(function(t){return t.id===cur;})) cur = 'classic';
  var wrap = document.getElementById('themeSwitch');
  function apply(id){
    cur = id;
    if(id==='classic') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', id);
    try { localStorage.setItem('verbTheme', id); } catch(e){}
    Array.prototype.forEach.call(wrap.children, function(b){ b.classList.toggle('active', b.dataset.id===id); });
  }
  THEMES.forEach(function(t){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'theme-dot'; b.dataset.id = t.id;
    b.title = t.name; b.setAttribute('aria-label', 'Theme: ' + t.name);
    b.style.background = 'linear-gradient(135deg,' + t.paper + ' 50%,' + t.accent + ' 50%)';
    b.onclick = function(){ apply(t.id); };
    wrap.appendChild(b);
  });
  apply(cur);
})();
</script>
